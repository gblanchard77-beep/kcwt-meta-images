# Deployed as kcwt-meta-images on scintillating-upliftment (Railway Pro).
# Enable Serverless (sleep after idle) to keep incremental cost under $5/mo.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
